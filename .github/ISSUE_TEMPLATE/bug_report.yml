name: 缺陷报告
description: 报告一个可以复现的问题（部署失败、功能异常、报错）
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        请先花一分钟确认下面两件事——它们能筛掉大半「其实不是 bug」的情况：

        1. **跑过一次「快速开始」里的验证步骤**（[docs/00-快速开始.md §五](../blob/main/docs/00-快速开始.md)）。
        2. **搜过已有 issue**，包括已关闭的。

        安全问题请**不要**开 public issue，走 [SECURITY.md](../blob/main/SECURITY.md) 里的私密渠道。

  - type: dropdown
    id: deploy
    attributes:
      label: 部署方式
      description: 不同方式的排障路径完全不同，请务必选对。
      options:
        - docker compose（一键全栈）
        - 本地 pnpm dev
        - 本地 pnpm build + node .next/standalone/server.js
        - 自建镜像 / K8s
        - 其他（在下方说明）
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: 版本
      description: 填 `package.json` 里的 version，或 git commit 短哈希。
      placeholder: "1.0.0 / git rev-parse --short HEAD"
    validations:
      required: true

  - type: textarea
    id: what
    attributes:
      label: 发生了什么
      description: 现象 + 你期望的结果。有截图或贴错误信息会快很多。
      placeholder: |
        点「注册」后页面没有任何反应，Network 里这个请求返回 503。
        期望：注册成功并进入工作台。
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: 复现步骤
      description: 从「干净启动」开始的顺序步骤。能稳定复现的问题修起来最快。
      placeholder: |
        1. docker compose up -d --build
        2. 打开 http://localhost:3000
        3. 填邮箱密码点注册
        4. 返回 503
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 服务端日志
      description: |
        `docker compose logs app` 或 `pnpm dev` 的终端输出。
        **错误响应里的 traceId 也请一并提供**——服务端日志里同一行会带 `[trace:xxx]`，
        两者对上是定位问题最快的路径。
        ⚠️ 贴之前请删掉 API Key、APP_SECRET、数据库密码。
      render: shell
    validations:
      required: false

  - type: input
    id: trace
    attributes:
      label: traceId
      description: 错误提示或响应体里的 `traceId`（形如 `trc...`）。没有就留空。
    validations:
      required: false

  - type: textarea
    id: env
    attributes:
      label: 环境
      description: 操作系统、Node 版本、PostgreSQL 版本；是否装了 pgvector、是否配了 Redis。
      placeholder: |
        Windows 11 / Node 20.11 / PostgreSQL 16.2
        pgvector：装了
        Redis：没配（走降级）
        DEMO_MODE：未设置（无 Key，自动演示）
    validations:
      required: true

  - type: checkboxes
    id: confirm
    attributes:
      label: 提交前确认
      options:
        - label: 我删除了日志里的密钥、密码等敏感信息
          required: true
        - label: 我搜过已有 issue，没有重复
          required: true
